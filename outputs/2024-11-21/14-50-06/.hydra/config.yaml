          front_left_foot: 0.785398
          front_right_foot: -0.785398
          left_back_foot: -0.785398
          right_back_foot: 0.785398
        joint_vel:
          .*: 0.0
      collision_group: 0
      debug_vis: false
      soft_joint_pos_limit_factor: 1.0
      actuators:
