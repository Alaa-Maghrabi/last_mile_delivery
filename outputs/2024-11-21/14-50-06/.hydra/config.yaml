          class_type: omni.isaac.lab.actuators.actuator_pd:ImplicitActuator
          joint_names_expr:
          - .*
          effort_limit: null
          velocity_limit: null
          stiffness: 0.0
          damping: 0.0
          armature: null
          friction: null
    light:
      class_type: {}
      prim_path: /World/light
      spawn:
        func: omni.isaac.lab.sim.spawners.lights.lights:spawn_light
        visible: true
        semantic_tags: null
        copy_from_source: true
        prim_type: DistantLight
        color:
        - 0.75
        - 0.75
        - 0.75
        enable_color_temperature: false
        color_temperature: 6500.0
        normalize: false
        exposure: 0.0
        intensity: 3000.0
        angle: 0.53
      init_state:
        pos:
        - 0.0
        - 0.0
        - 0.0
        rot:
        - 1.0
        - 0.0
        - 0.0
        - 0.0
      collision_group: 0
      debug_vis: false
